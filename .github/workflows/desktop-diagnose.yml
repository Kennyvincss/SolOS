name: Desktop extension check

# Installs real wallet extensions (Phantom, Solflare, Backpack) into the
# desktop app, opens their popups and prints what rendered and any errors.
# Also checks the in-app Chrome Web Store search. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated Chrome Web Store extension IDs"
        required: false
        default: "bfnaelmomeimhlpmgjnjophhpkkoljpa,bhhhlbepdkbapadjdnnojkbgioiodbic,aflkmfhebedbjioipglgcbcmnbpgliof"
      checks:
        description: "Which checks to run: extensions, phantom, site, jupiter, pnl (comma-separated)"
        required: false
        default: "extensions,phantom,site"
      wallet:
        description: "Wallet to check PnL for (optional)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # Run with Chromium's sandbox on, like on users' computers (extension
      # service-worker preloads only run when sandboxed).
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Website speed
        if: contains(inputs.checks, 'site')
        working-directory: .
        run: |
          for u in / /extensions /wallets /tokens /ai /apps /api/tokens?list=trending /api/apps /api/news /api/network /api/account/6UhUkSBc9RBB9gVJcjCWtcQv4t771rQF7bdn2qK7pump /api/wallets/5Q544fKrFoe6tsEbD7S8EmxGTJYAKtTVhAW5Q5pge4j1 /api/status /api/search?q=jup; do
            for i in 1 2; do
              curl -s -o /dev/null -w "[site] %{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download} $u\n" "https://solos-rho.vercel.app$u"
            done
          done
      - name: PnL
        if: contains(inputs.checks, 'pnl')
        working-directory: .
        run: |
          RPC=https://api.mainnet-beta.solana.com
          echo "[pnl] batch request to the public RPC:"
          curl -s -m 20 -w " http=%{http_code}\n" $RPC -H 'content-type: application/json' -d '[{"jsonrpc":"2.0","id":1,"method":"getSlot"},{"jsonrpc":"2.0","id":2,"method":"getSlot"}]' | head -c 400; echo
          # A wallet that trades: the one given, else the signer of a recent Jupiter swap.
          W="${{ inputs.wallet }}"
          if [ -z "$W" ]; then
            SIG=$(curl -s -m 20 $RPC -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"getSignaturesForAddress","params":["JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4",{"limit":20}]}' | jq -r '[(.result // [])[] | select(.err == null)][5].signature // empty' || true)
            [ -n "$SIG" ] && W=$(curl -s -m 20 $RPC -H 'content-type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getTransaction\",\"params\":[\"$SIG\",{\"encoding\":\"json\",\"maxSupportedTransactionVersion\":0}]}" | jq -r '.result.transaction.message.accountKeys[0] // empty' || true)
          fi
          W=${W:-5Q544fKrFoe6tsEbD7S8EmxGTJYAKtTVhAW5Q5pge4j1}
          echo "[pnl] wallet $W"
          echo "[pnl] site status: $(curl -s -m 20 https://solos-rho.vercel.app/api/status)"
          for w in $W; do
            echo "[pnl] first request (quick pass):"
            curl -s -m 90 -w "\n[pnl] http=%{http_code} total=%{time_total}s\n" "https://solos-rho.vercel.app/api/wallets/$w/pnl" | head -c 1500; echo || true
            echo "[pnl] portfolio while the background pass runs:"
            curl -s -m 60 -o /dev/null -w "[pnl] portfolio http=%{http_code} total=%{time_total}s\n" "https://solos-rho.vercel.app/api/wallets/$w" || true
            sleep 35
            echo "[pnl] again after 35 s (should be the saved full result):"
            curl -s -m 90 -w "\n[pnl] http=%{http_code} total=%{time_total}s\n" "https://solos-rho.vercel.app/api/wallets/$w/pnl" | head -c 1500; echo || true
          done
      - name: Jupiter links
        if: contains(inputs.checks, 'jupiter')
        run: timeout 200 xvfb-run -a npx electron test/check-jupiter.js 2>&1 | grep "^\\[jup" || true
      - name: Phantom end-to-end
        if: contains(inputs.checks, 'phantom')
        run: |
          set +e
          timeout 300 xvfb-run -a npx electron test/e2e-phantom.js > e2e.log 2>&1
          echo "exit code: $?"
          grep -v -E "dbus|Fontconfig|viz_main|gpu_|NOTREACHED|DEPRECATED|Datadog|zustand" e2e.log | tail -150
      - name: Check extensions
        if: contains(inputs.checks, 'extensions')
        env:
          EXT_IDS: ${{ inputs.ids }}
        run: timeout 300 xvfb-run -a npx electron test/check-real-extensions.js 2>&1 | grep -v -E "dbus|Fontconfig|viz_main|gpu_" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-check
          path: desktop/diag/
