name: Desktop extension check

# Installs real wallet extensions (Phantom, Solflare, Backpack) into the
# desktop app, opens their popups and prints what rendered and any errors.
# Also checks the in-app Chrome Web Store search. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated Chrome Web Store extension IDs"
        required: false
        default: "bfnaelmomeimhlpmgjnjophhpkkoljpa,bhhhlbepdkbapadjdnnojkbgioiodbic,aflkmfhebedbjioipglgcbcmnbpgliof"
      checks:
        description: "Which checks to run: extensions, phantom, site, perf, jupiter, pnl, turnstile, google (comma-separated)"
        required: false
        default: "extensions,phantom,site"
      wallet:
        description: "Wallet to check PnL for (optional)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # Run with Chromium's sandbox on, like on users' computers (extension
      # service-worker preloads only run when sandboxed).
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Website speed
        if: contains(inputs.checks, 'site')
        working-directory: .
        run: |
          for u in / /extensions /wallets /tokens /ai /apps /api/tokens?list=trending /api/apps /api/news /api/network /api/account/6UhUkSBc9RBB9gVJcjCWtcQv4t771rQF7bdn2qK7pump /api/wallets/5Q544fKrFoe6tsEbD7S8EmxGTJYAKtTVhAW5Q5pge4j1 /api/status /api/search?q=jup; do
            for i in 1 2; do
              curl -s -o /dev/null -w "[site] %{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download} $u\n" "https://solos-rho.vercel.app$u"
            done
          done
      - name: Page speed (Lighthouse)
        if: contains(inputs.checks, 'perf')
        working-directory: .
        run: |
          npm i -g lighthouse@12 >/dev/null 2>&1
          # Logo thumbnails: original vs /api/img copy.
          for img in https://static.jup.ag/jup/icon.png https://raw.githubusercontent.com/solana-labs/token-list/main/assets/mainnet/So11111111111111111111111111111111111111112/logo.png; do
            curl -s -o /dev/null -w "[perf] logo original %{http_code} %{size_download}B $img\n" "$img"
            curl -s -o /dev/null -w "[perf] logo /api/img %{http_code} %{content_type} %{size_download}B\n" "https://solos-rho.vercel.app/api/img?u=$(jq -rn --arg u "$img" '$u|@uri')&s=40" -L
          done
          for u in / /tokens /wallets /apps /ai /search?q=jup; do
            for form in mobile desktop; do
              extra=""; [ "$form" = desktop ] && extra="--preset=desktop"
              # Best of 2 runs (a cold serverless start can add a second to one run).
              best=""
              for run in 1 2; do
                lighthouse "https://solos-rho.vercel.app$u" $extra --only-categories=performance --output=json --output-path=/tmp/lh.json --quiet --chrome-flags="--headless=new --no-sandbox" >/dev/null 2>&1 || continue
                line=$(jq -r '[(.categories.performance.score*100|round), (.audits["first-contentful-paint"].numericValue|round), (.audits["largest-contentful-paint"].numericValue|round), (.audits["total-blocking-time"].numericValue|round), (.audits["cumulative-layout-shift"].numericValue*1000|round/1000), (.audits["speed-index"].numericValue|round), (.audits["server-response-time"].numericValue|round), ((.audits["total-byte-weight"].numericValue/1024)|round), ([.audits["network-requests"].details.items[] | select(.resourceType=="Script") | .transferSize] | add / 1024 | round)] | @tsv' /tmp/lh.json)
                score=$(echo "$line" | cut -f1)
                bscore=$(echo "$best" | cut -f1)
                if [ -z "$best" ] || [ "$score" -gt "${bscore:-0}" ]; then best="$line"; fi
              done
              echo "[perf] $form $u score fcp_ms lcp_ms tbt_ms cls si_ms ttfb_ms total_kb js_kb: $best"
              [ "$form" = mobile ] && jq -r '[.audits["network-requests"].details.items[] | {kb: ((.transferSize // 0)/1024|round), t: .resourceType, u: .url[0:140]}] | sort_by(-.kb) | .[0:6][] | "[perf]    \(.kb)KB \(.t) \(.u)"' /tmp/lh.json || true
            done
          done
      - name: PnL
        if: contains(inputs.checks, 'pnl')
        working-directory: .
        run: |
          RPC=https://api.mainnet-beta.solana.com
          echo "[pnl] batch request to the public RPC:"
          curl -s -m 20 -w " http=%{http_code}\n" $RPC -H 'content-type: application/json' -d '[{"jsonrpc":"2.0","id":1,"method":"getSlot"},{"jsonrpc":"2.0","id":2,"method":"getSlot"}]' | head -c 400; echo
          # A wallet that trades: the one given, else the signer of a recent Jupiter swap.
          W="${{ inputs.wallet }}"
          if [ -z "$W" ]; then
            SIG=$(curl -s -m 20 $RPC -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"getSignaturesForAddress","params":["JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4",{"limit":20}]}' | jq -r '[(.result // [])[] | select(.err == null)][5].signature // empty' || true)
            [ -n "$SIG" ] && W=$(curl -s -m 20 $RPC -H 'content-type: application/json' -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getTransaction\",\"params\":[\"$SIG\",{\"encoding\":\"json\",\"maxSupportedTransactionVersion\":0}]}" | jq -r '.result.transaction.message.accountKeys[0] // empty' || true)
          fi
          W=${W:-5Q544fKrFoe6tsEbD7S8EmxGTJYAKtTVhAW5Q5pge4j1}
          echo "[pnl] wallet $W"
          echo "[pnl] site status: $(curl -s -m 20 https://solos-rho.vercel.app/api/status)"
          for w in $W; do
            echo "[pnl] first request (quick pass):"
            curl -s -m 90 -w "\n[pnl] http=%{http_code} total=%{time_total}s\n" "https://solos-rho.vercel.app/api/wallets/$w/pnl" | head -c 1500; echo || true
            echo "[pnl] portfolio while the background pass runs:"
            curl -s -m 60 -o /dev/null -w "[pnl] portfolio http=%{http_code} total=%{time_total}s\n" "https://solos-rho.vercel.app/api/wallets/$w" || true
            sleep 35
            echo "[pnl] again after 35 s (should be the saved full result):"
            curl -s -m 90 -w "\n[pnl] http=%{http_code} total=%{time_total}s\n" "https://solos-rho.vercel.app/api/wallets/$w/pnl" | head -c 1500; echo || true
          done
      - name: Cloudflare Turnstile
        if: contains(inputs.checks, 'turnstile')
        env:
          TURNSTILE_PAGES: https://seleniumbase.io/apps/turnstile
          SNAPSHOT: https://example.com/
        run: |
          echo "--- real Google Chrome on this machine (baseline)"
          timeout 200 xvfb-run -a node test/check-turnstile-chrome.mjs > chrome.log 2>&1 || true
          grep "^\[turnstile" chrome.log || true
          echo "--- bare Electron window (no STRATA code)"
          UA=chrome timeout 150 xvfb-run -a npx electron test/check-turnstile-bare.js > electron.log 2>&1 || true
          grep "^\[bare" electron.log | cut -c1-400 || true
          for v in "PERM=1 PS=1 AUTOPLAY=1" "PERM=1 PS=1 AUTOPLAY=1 BRAND=1 SHIM=1"; do
            env UA=chrome SNAPSHOT= $v timeout 150 xvfb-run -a npx electron test/check-turnstile-bare.js 2>&1 | grep "^\[bare" | grep -E "PASSED|NOT PASSED" | cut -c1-200 || true
          done
          echo "--- what a page can see: Chrome vs Electron (differences only)"
          python3 - <<'PY'
          import json, re
          def snap(f, tag):
              for l in open(f, errors="ignore"):
                  if l.startswith(tag):
                      return json.loads(l[len(tag):].strip())
              return {}
          c, e = snap("chrome.log", "[snapshot-chrome] "), snap("electron.log", "[snapshot-electron] ")
          print("chrome keys", len(c), "electron keys", len(e))
          for k in sorted(set(c) | set(e)):
              if c.get(k) != e.get(k):
                  cv, ev = str(c.get(k)), str(e.get(k))
                  if k in ("navigatorProps", "featurePolicy"):
                      cs, es = set(cv.split(",")), set(ev.split(","))
                      print(f"[diff] {k}: only Chrome: {sorted(cs - es)} | only Electron: {sorted(es - cs)}")
                  else:
                      print(f"[diff] {k}: Chrome={cv[:150]} | Electron={ev[:150]}")
          PY
      - name: Google sign-in
        if: contains(inputs.checks, 'google')
        run: |
          timeout 120 xvfb-run -a node test/check-google-signin-chrome.mjs 2>&1 | grep "^\[google" || true
          for v in "MODE=strata" "MODE=strata POPUP=1" "MODE=strata" "MODE=strata POPUP=1" "MODE=strata" "MODE=strata POPUP=1"; do
            env $v timeout 120 xvfb-run -a npx electron test/check-google-signin.js 2>&1 | grep "^\[google" | cut -c1-300 || true
          done
      - name: Jupiter links
        if: contains(inputs.checks, 'jupiter')
        run: timeout 200 xvfb-run -a npx electron test/check-jupiter.js 2>&1 | grep "^\\[jup" || true
      - name: Phantom end-to-end
        if: contains(inputs.checks, 'phantom')
        run: |
          set +e
          sudo apt-get install -y -qq gdb >/dev/null 2>&1 || true
          timeout 300 xvfb-run -a npx electron test/e2e-phantom.js > e2e.log 2>&1 &
          RUN=$!
          # If the main process stops logging its heartbeat, print where it is stuck.
          ( for i in $(seq 1 280); do
              sleep 1
              if grep -q "sign message: start" e2e.log && [ $(( $(date +%s) - $(stat -c %Y e2e.log) )) -gt 15 ]; then
                PID=$(pgrep -f "electron/dist/electron test/e2e-phantom.js" | head -1)
                echo "=== main process $PID looks stuck; native stack:" >> e2e.log
                sudo gdb -p "$PID" -batch -ex "thread apply 1 bt 40" >> e2e.log 2>&1 || true
                break
              fi
            done ) &
          wait $RUN
          echo "exit code: $?"
          grep -v -E "dbus|Fontconfig|viz_main|gpu_|NOTREACHED|DEPRECATED|Datadog|zustand" e2e.log | tail -250
      - name: Phantom Google sign-in
        if: contains(inputs.checks, 'phantomgoogle')
        run: timeout 200 xvfb-run -a npx electron test/check-phantom-google.js 2>&1 | grep "^\\[pg" | cut -c1-1400 || true
      - name: Check extensions
        if: contains(inputs.checks, 'extensions')
        env:
          EXT_IDS: ${{ inputs.ids }}
        run: timeout 300 xvfb-run -a npx electron test/check-real-extensions.js 2>&1 | grep -v -E "dbus|Fontconfig|viz_main|gpu_" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-check
          path: desktop/diag/
