# Microsoft Store screenshots of the desktop app against the live site.
# Download them from the run's "store-screenshots" artifact.
name: Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb ffmpeg
      # Chromium's sandbox, like on users' computers.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Take screenshots
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/cfg"
          export SHOTS_DIR="$RUNNER_TEMP/shots"
          timeout 900 xvfb-run -a -s "-screen 0 1920x1080x24" npx electron test/store-screenshots.js > shots.log 2>&1 || true
          grep -E "^\[shots\]" shots.log || tail -40 shots.log
          ls -la "$SHOTS_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: ${{ runner.temp }}/shots/*.png
      # Also on a "store-screenshots" pre-release, for direct download links.
      - name: Publish to the store-screenshots release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view store-screenshots >/dev/null 2>&1 || gh release create store-screenshots --prerelease --title "Microsoft Store screenshots" --notes "Screenshots for the Microsoft Store listing (1920x1080)."
          gh release upload store-screenshots "$RUNNER_TEMP"/shots/*.png --clobber
