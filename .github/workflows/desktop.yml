name: Desktop app

# Builds STRATA installers for macOS, Windows and Linux.
#
# - "Run workflow" (Actions tab): builds installers as downloadable artifacts.
# - Push a tag like desktop-v0.2.0 (or publish a release with that tag):
#   builds and attaches the installers to that GitHub Release.
# - "Run workflow" with release_tag set: rebuilds into an existing release.
#   Installed copies of the app update themselves from the latest release.
#
# Code signing (optional; builds are unsigned until these secrets exist):
#   macOS:   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
#   Windows: WIN_CERT_P12_BASE64, WIN_CERT_PASSWORD
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish to this release tag (e.g. desktop-v0.2.0). Leave empty to only build."
        required: false
        default: ""
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || inputs.release_tag }}

jobs:
  # Create the release once, so the three build jobs don't race to create it.
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if needed
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$RELEASE_TAG" in desktop-v[0-9]*) ;; *) echo "release_tag must look like desktop-v1.2.3"; exit 1;; esac
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "STRATA ${RELEASE_TAG#desktop-v}" --notes "Installers for macOS, Windows and Linux. Installed copies update automatically."

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      # Each profile its own taskbar entry: Windows must accept the taskbar settings.
      - name: Profile taskbar icons (Windows)
        if: runner.os == 'Windows'
        run: npx electron test/smoke-profile-icons.js

      - name: Use the tag as the app version
        if: env.RELEASE_TAG != ''
        run: |
          case "$RELEASE_TAG" in desktop-v[0-9]*) ;; *) echo "release_tag must look like desktop-v1.2.3"; exit 1;; esac
          npm version "${RELEASE_TAG#desktop-v}" --no-git-tag-version --allow-same-version

      # Only pass signing settings that actually exist: electron-builder treats
      # an empty CSC_LINK as a (missing) file and fails.
      - name: Signing settings
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_PASS: ${{ secrets.MAC_CERT_PASSWORD }}
          WIN_CERT: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_PASS: ${{ secrets.WIN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          # Azure Trusted Signing (Windows): removes the "unknown publisher"
          # SmartScreen warning once set up. See desktop/SIGNING.md.
          AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZ_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZ_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZ_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          put() { if [ -n "$2" ]; then { echo "$1<<__EOF__"; echo "$2"; echo "__EOF__"; } >> "$GITHUB_ENV"; fi; }
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CERT" ]; then
            put CSC_LINK "$MAC_CERT"; put CSC_KEY_PASSWORD "$MAC_PASS"
            put APPLE_ID "$APPLE_ID"; put APPLE_APP_SPECIFIC_PASSWORD "$APPLE_PASS"; put APPLE_TEAM_ID "$APPLE_TEAM"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZ_SECRET" ] && [ -n "$AZ_ENDPOINT" ]; then
            put AZURE_TENANT_ID "$AZ_TENANT"; put AZURE_CLIENT_ID "$AZ_CLIENT"; put AZURE_CLIENT_SECRET "$AZ_SECRET"
            node -e '
              const fs = require("fs"), p = JSON.parse(fs.readFileSync("package.json", "utf8")), e = process.env;
              p.build.win.azureSignOptions = { endpoint: e.AZ_ENDPOINT, codeSigningAccountName: e.AZ_ACCOUNT, certificateProfileName: e.AZ_PROFILE, publisherName: e.AZ_PUBLISHER };
              fs.writeFileSync("package.json", JSON.stringify(p, null, 2));
            '
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CERT" ]; then
            put WIN_CSC_LINK "$WIN_CERT"; put WIN_CSC_KEY_PASSWORD "$WIN_PASS"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "::warning::Windows build is unsigned, so SmartScreen will warn people who download it. See desktop/SIGNING.md."
          fi

      - name: Build (and publish on tags)
        run: npx electron-builder --publish "${{ env.RELEASE_TAG != '' && 'always' || 'never' }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allow uploading to a release that was published more than 2 hours ago (re-runs).
          EP_GH_IGNORE_TIME: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: solana-os-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.yml
          if-no-files-found: error
