<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: crx:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>STRATA</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <header id="toolbar">
      <div id="tabstrip">
        <div id="tabs" role="tablist" aria-label="Tabs"></div>
        <button id="new-tab" class="icon" title="New tab (Ctrl+T)" aria-label="New tab">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <div class="drag-fill"></div>
      </div>
      <nav id="navbar">
        <div id="nav-lead"></div>
        <button id="back" class="icon" title="Back (Alt+Left)" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg></button>
        <button id="forward" class="icon" title="Forward (Alt+Right)" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg></button>
        <button id="reload" class="icon" title="Reload (Ctrl+R)" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" /></svg></button>
        <form id="address-form" autocomplete="off">
          <span id="risk" class="risk" hidden></span>
          <input id="address" spellcheck="false" autocomplete="off" placeholder="Search tokens, wallets, apps, or type a URL" aria-label="Address and search bar" />
          <button id="reading" type="button" class="in-field" title="Add to reading list" aria-label="Add to reading list" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z" /><path d="M8 9h6M8 13h4" /></svg>
          </button>
          <button id="star" type="button" class="in-field star" title="Bookmark this tab (Ctrl+D)" aria-label="Bookmark this tab" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" /></svg>
          </button>
        </form>
        <button id="split" class="icon" title="Split view" aria-label="Split view"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="7.5" height="14" rx="2" /><rect x="13.5" y="5" width="7.5" height="14" rx="2" /></svg></button>
        <div class="ext-dock" role="group" aria-label="Extensions">
          <span id="actions-slot"></span>
          <button id="extensions" class="icon" title="Extensions" aria-label="Extensions">
            <svg viewBox="0 0 24 24"><path d="M10 4.5a2 2 0 1 1 4 0V6h3.5a1 1 0 0 1 1 1v3.5H20a2 2 0 1 1 0 4h-1.5V18a1 1 0 0 1-1 1H14v-1.5a2 2 0 1 0-4 0V19H6.5a1 1 0 0 1-1-1v-3.5H7a2 2 0 1 0 0-4H5.5V7a1 1 0 0 1 1-1H10z" /></svg>
          </button>
        </div>
        <span class="sep"></span>
        <button id="wallet" class="icon" title="Wallet" aria-label="Wallet"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v4M3 7v10a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zm14 6h.01" /></svg></button>
        <button id="notifications" class="icon" title="Notifications" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0" /></svg></button>
        <button id="ai" class="ai" title="STRATA AI (Ctrl+Shift+A)" aria-label="STRATA AI" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z" /></svg>
          <span>AI</span>
        </button>
        <button id="profile" class="avatar" title="Profile" aria-label="Profile"></button>
        <button id="menu" class="icon" title="Customize and control STRATA" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M12 5.5h.01M12 12h.01M12 18.5h.01" style="stroke-width: 3" /></svg>
        </button>
      </nav>
      <div id="bookmarks-bar" hidden></div>
    </header>

    <aside id="sidebar" hidden>
      <div class="side-top">
        <label class="side-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4-4" /></svg>
          <input id="tab-search" placeholder="Search tabs" spellcheck="false" />
        </label>
      </div>
      <div id="side-pinned"></div>
      <div id="side-tabs" role="tablist" aria-label="Tabs"></div>
      <div class="side-foot">
        <button id="side-new" class="side-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg><span>New tab</span></button>
        <button id="side-collapse" class="icon" title="Collapse sidebar" aria-label="Collapse sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" /><path d="M9 4v16" /></svg></button>
      </div>
    </aside>

    <div id="stage">
      <div id="pane-frames"></div>
      <div id="divider" hidden><span></span></div>
      <div id="panel-edge" hidden></div>
    </div>
    <script src="shell.js"></script>
  </body>
</html>
