<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <link rel="stylesheet" href="bubble.css" />
    <style>
      html, body { border-radius: 12px; }
      body { border: 1px solid var(--border); }
      .wrap { padding: 16px 16px 14px; }
      .head { display: flex; align-items: flex-start; gap: 10px; }
      .head h1 { flex: 1; margin: 0; font-size: 13.5px; font-weight: 500; line-height: 1.4; }
      .head h1 b { font-weight: 650; word-break: break-all; }
      .x { width: 24px; height: 24px; margin: -4px -6px 0 0; border-radius: 6px; display: grid; place-items: center; color: var(--muted); flex: none; }
      .x:hover { background: var(--hover); }
      .x svg { width: 14px; height: 14px; }
      .what { display: flex; align-items: center; gap: 10px; margin-top: 12px; color: var(--muted); }
      .what svg { width: 18px; height: 18px; flex: none; }
      .actions { margin-top: 16px; }
      .btn { min-width: 84px; border-radius: 999px; }
    </style>
  </head>
  <body>
    <div class="wrap" id="root"></div>
    <script src="permission.js"></script>
  </body>
</html>
